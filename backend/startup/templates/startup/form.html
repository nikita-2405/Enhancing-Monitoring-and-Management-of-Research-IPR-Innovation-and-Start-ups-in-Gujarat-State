
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        form p {
            margin-bottom: 16px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        label {
            font-weight: bold;
        }

        button, .cancel {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            color: white;
            text-decoration: none;
            cursor: pointer;
            margin-top: 12px;
        }

        button {
            background: #15803d;
        }

        .cancel {
            background: #64748b;
        }

        .errorlist {
            color: #dc2626;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>{{ page_title }}</h1>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Save Startup</button>
            <a href="{% url 'startup-page' %}" class="cancel">Cancel</a>
        </form>
    </div>

</body>
</html>
